server:
  port: 8081
spring:
  application:
    name: "Solicitudes"
  devtools:
    add-properties: false
  h2:
    console:
      enabled: true
      path: "/h2"
  profiles:
    include: null

management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      probes:
        enabled: true
cors:
  allowed-origins: "http://localhost:4200,http://localhost:8081"
adapters:
    r2dbc:
      host: "localhost"
      port: 5432
      database: "solicitudes"
      schema: "public"
      username: "postgres"
      password: "1234"
routes:
  paths:
    applications:
      applications: "/api/v1/solicitudes"
    users:
      baseUrl: "http://localhost:8080"
      existsByDocument: "/api/v1/usuarios/{document}"
